name: upskale_storefront
description: >-
  The tenant API client, guest session, location and store search, menu,
  cart, checkout, orders, reviews and account for Flutter storefronts on
  Upskale Labs — the Dart counterpart of @sinyagepr/storefront-sdk.
version: 0.5.0
publish_to: none
repository: https://github.com/iamsinyagepr/storefront-sdk-flutter

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  http: ^1.2.0
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
